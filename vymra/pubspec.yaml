  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  path_provider: ^2.1.4
  http: ^1.2.2
  webview_flutter: ^4.13.0
  webview_flutter_wkwebview: ^3.25.1
  url_launcher: ^6.3.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
